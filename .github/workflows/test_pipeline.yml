name: "🧪 Test Pipeline (3 segments)"

on:
  workflow_dispatch:   # Test uniquement manuel — jamais automatique

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 30 min max pour le test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer FFmpeg système
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances NPM
        run: npm install

      - name: "🚀 Lancer le script de test complet"
        run: node scripts/test_pipeline.js
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          DELFA_API_URL:        ${{ secrets.DELFA_API_URL }}
          IMAGE_API_URL:        ${{ secrets.IMAGE_API_URL }}
