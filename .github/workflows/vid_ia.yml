name: "🎬 Vid IA Pipeline PRO v2"

on:
  schedule:
    # Europe/Paris schedule (UTC)
    - cron: '0 4,12,20 * * *'   # 06:00, 14:00, 22:00 Paris
  workflow_dispatch:
    inputs:
      theme:
        description: 'Force theme (manga, dessin_anime, actualites, horreur, auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - manga
          - dessin_anime
          - actualites
          - horreur

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "🔧 Install FFmpeg"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: "📦 Install dependencies"
        run: npm install
        timeout-minutes: 5

      - name: "📁 Prepare folders"
        run: mkdir -p tmp_data/clips tmp_data/images tmp_data/audio

      # ──────────────────────────────────────────────────────────
      # NEW PRO PIPELINE (v2) — Video with embedded audio
      # ──────────────────────────────────────────────────────────
      - name: "🤖 STEP 1 — Generate VIRAL script"
        run: node scripts/step1_generate_script.js
        timeout-minutes: 8
        env:
          DELFA_API_URL: ${{ secrets.DELFA_API_URL }}
          PIPELINE_THEME: ${{ github.event.inputs.theme || 'auto' }}
          MANGA_SEGMENTS: '48'
          CARTOON_SEGMENTS: '24'

      - name: "🎬 STEP 2 — Generate video clips WITH AUDIO INTEGRATED (PRO)"
        run: node scripts/step2_generate_videos.js
        timeout-minutes: 60
        env:
          IMAGE_API_URL: ${{ secrets.IMAGE_API_URL }}
          VIDEO_API_URL: ${{ secrets.VIDEO_API_URL || secrets.IMAGE_API_URL }}
          DELFA_API_URL: ${{ secrets.DELFA_API_URL }}

      - name: "✅ STEP 2b — Verify clips"
        run: node scripts/step2b_verify_images.js || echo "Verification skipped (new PRO mode)"
        timeout-minutes: 10

      - name: "🎞️ STEP 4 — Assemble final video (crossfade)"
        run: node scripts/step4_assemble_video.js
        timeout-minutes: 20

      - name: "✍️ STEP 5 — Generate title & hashtags"
        run: node scripts/step5_generate_filename.js
        timeout-minutes: 5
        env:
          DELFA_API_URL: ${{ secrets.DELFA_API_URL }}

      - name: "▶️ STEP 6 — Upload to YouTube"
        run: node scripts/upload_youtube.js
        timeout-minutes: 15
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
